name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validar versao da tag
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "A tag deve usar o formato vX.Y.Z; recebido '$tag'."
          }
          $tagVersion = $Matches[1]
          & git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "A tag precisa apontar para um commit presente na branch main."
          }
          $versionScript = @'
          import ast
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          project = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          package_tree = ast.parse(
              (root / 'src' / 'print_monitor' / '__init__.py').read_text(encoding='utf-8')
          )
          package_version = None
          for node in package_tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == '__version__':
                          package_version = ast.literal_eval(node.value)
          if package_version is None:
              raise SystemExit('__version__ nao encontrado')
          print(project['project']['version'] + '|' + package_version)
          '@
          $versions = & python -c $versionScript
          if ($LASTEXITCODE -ne 0) {
              throw "Nao foi possivel ler as versoes do projeto."
          }
          $projectVersion, $packageVersion = $versions.Trim().Split("|")
          if ($tagVersion -ne $projectVersion -or $tagVersion -ne $packageVersion) {
              throw "Versoes divergentes: tag=$tagVersion, pyproject=$projectVersion, pacote=$packageVersion."
          }

      - name: Instalar dependencias de qualidade
        run: python -m pip install --upgrade pip ".[dev,dashboard]"

      - name: Verificar qualidade
        shell: powershell
        run: |
          & python -m ruff check src tests scripts
          if ($LASTEXITCODE -ne 0) {
              throw "Ruff encontrou problemas."
          }
          & python -m ruff format --check src tests scripts
          if ($LASTEXITCODE -ne 0) {
              throw "A formatacao nao esta atualizada."
          }

      - name: Rodar testes
        run: python -m pytest

      - name: Gerar executavel Windows
        shell: powershell
        run: .\build.ps1

      - name: Validar executavel e gerar checksum
        shell: powershell
        run: |
          $exe = Resolve-Path ".\dist\print-monitor.exe"
          if ((Get-Item -LiteralPath $exe).Length -lt 1MB) {
              throw "Executavel ausente ou inesperadamente pequeno."
          }
          $process = Start-Process -FilePath $exe -ArgumentList "--help" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
              throw "Smoke test do executavel falhou com codigo $($process.ExitCode)."
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  print-monitor.exe" |
              Set-Content -LiteralPath ".\dist\SHA256SUMS" -Encoding ascii

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          gh release create "${{ github.ref_name }}" `
              ".\dist\print-monitor.exe#Executavel Windows" `
              ".\dist\SHA256SUMS#Checksums SHA-256" `
              --verify-tag `
              --generate-notes `
              --title "print-monitor ${{ github.ref_name }}"
