name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias de teste
        run: python -m pip install --upgrade pip ".[dev,dashboard]"

      - name: Verificar qualidade do codigo
        run: ruff check src tests scripts

      - name: Verificar formatacao do codigo
        run: ruff format --check src tests scripts

      - name: Rodar os testes
        run: python -m pytest

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ferramenta de build
        run: python -m pip install --upgrade pip build

      - name: Gerar wheel
        run: python -m build --wheel

      - name: Instalar e validar wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -m print_monitor --help

  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Gerar executavel Windows
        shell: powershell
        run: .\build.ps1

      - name: Validar executavel Windows
        shell: powershell
        run: |
          $exe = Resolve-Path ".\dist\print-monitor.exe"
          if ((Get-Item -LiteralPath $exe).Length -lt 1MB) {
              throw "Executavel ausente ou inesperadamente pequeno."
          }
          $process = Start-Process -FilePath $exe -ArgumentList "--help" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
              throw "Smoke test do executavel falhou com codigo $($process.ExitCode)."
          }
