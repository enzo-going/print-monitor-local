<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Print Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">PM</span>
      <span>
        <strong>Print Monitor</strong>
        <small>controle local de impressão</small>
      </span>
    </a>
    <nav aria-label="Navegação principal">
      <a href="/" {% if request.endpoint == "index" %}class="active" aria-current="page"{% endif %}>
        Visão mensal
      </a>
      <a href="/readings" {% if request.endpoint in ("readings_view", "readings_add") %}class="active" aria-current="page"{% endif %}>
        Histórico
      </a>
      <a href="/printers" {% if request.endpoint and request.endpoint.startswith("printers") %}class="active" aria-current="page"{% endif %}>
        Impressoras
      </a>
      <a href="/discover" {% if request.endpoint == "discover_view" %}class="active" aria-current="page"{% endif %}>
        Descobrir
      </a>
    </nav>
  </header>

  <main>
    <div class="flash-stack" role="status" aria-live="polite">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
